# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: polypus

builds:
  - id: polypus
    main: ./cmd/polypus
    binary: polypus
    env:
      - CGO_ENABLED=0
      - GOWORK=off
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/behaviorengineering/polypus/internal/cli.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  abbrev: -1

release:
  name_template: "v{{.Version}}"

# Polypus deploy stack, run by polypus deploy run. Image pins: .env.images (written per deploy, no :latest).
# Secrets: .env.deploy from polypus deploy export-env.
# Containers and volumes are named by the compose project, polypus-<identifier>, so two
# environments run side by side on one host.
# Profiles: routers runs Switchyard; observability runs the OTLP collector, Phoenix and HyperDX.
# polypus deploy picks them from the gateway YAML and the environment's observability switch.
# No host ports: everything is reached over the tailnet through the tailscale service
# (443 to the gateway; 4317, 4318, 6006 and 8080 to the observability services).
# Usage: docker compose -f docker-compose.deploy.yml -p polypus-<identifier> --env-file .env.images --env-file .env.deploy up -d

services:
  gateway:
    image: ${POLYPUS_IMAGE}
    restart: on-failure:5
    environment:
      POLYPUS_HOST: "0.0.0.0"
      POLYPUS_PORT: "1320"
      POLYPUS_BASE_URL: http://gateway:1320
      POLYPUS_SWITCHYARD_BASE_URL: http://switchyard:4000
      POLYPUS_SWITCHYARD_CONFIG: /var/lib/polypus/switchyard/routes.toml
      # deploy sets POLYPUS_SWITCHYARD=1 and COMPOSE_PROFILES=routers when host config has routers:
      POLYPUS_SWITCHYARD: "${POLYPUS_SWITCHYARD:-0}"
      POLYPUS_CONFIG: /etc/polypus/config.yaml
      # Set only when the gateway YAML has a Cloudflare backend.
      CF_AI_API_KEY: ${CF_AI_API_KEY:-}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_KEY_FREE: ${GEMINI_API_KEY_FREE:-}
      # Empty when observability is off: traces stay local (failure dumps still written).
      POLYPUS_OTLP_ENDPOINT: ${POLYPUS_DEPLOY_OTLP_ENDPOINT?run through polypus deploy}
      POLYPUS_PHOENIX: "false"
      POLYPUS_FAILURE_DUMP_DIR: /var/lib/polypus/inference-failures
      POLYPUS_MODELS_ALLOW_OVERLAY: /var/lib/polypus/state/models-allow-overlay.yaml
      POLYPUS_ADMIN_KEYS: /var/lib/polypus/state/admin-api-keys.json
    volumes:
      - ${POLYPUS_HOST_CONFIG}:/etc/polypus/config.yaml:ro
      - switchyard_routes:/var/lib/polypus/switchyard
      - polypus_state:/var/lib/polypus/state
      - polypus_inference_failures:/var/lib/polypus/inference-failures
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:1320/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 45s

  switchyard:
    profiles: ["routers"]
    image: ${SWITCHYARD_IMAGE}
    restart: unless-stopped
    environment:
      SWITCHYARD_CONFIG: /var/lib/polypus/switchyard/routes.toml
      SWITCHYARD_HOST: "0.0.0.0"
      SWITCHYARD_PORT: "4000"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${POLYPUS_DEPLOY_OTLP_ENDPOINT?run through polypus deploy}
      OTEL_SERVICE_NAME: switchyard-server
      SWITCHYARD_FAILURE_DUMP_DIR: /var/lib/switchyard/inference-failures
    volumes:
      - switchyard_routes:/var/lib/polypus/switchyard
      - switchyard_inference_failures:/var/lib/switchyard/inference-failures
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:4000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 60s
    depends_on:
      gateway:
        condition: service_healthy

  phoenix:
    profiles: ["observability"]
    image: ${PHOENIX_IMAGE}
    restart: unless-stopped
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix_data:/data

  hyperdx:
    profiles: ["observability"]
    image: ${HYPERDX_IMAGE}
    restart: unless-stopped
    environment:
      CUSTOM_OTELCOL_CONFIG_FILE: /etc/otelcol-contrib/custom.config.yaml
    volumes:
      - ./hyperdx.custom.config.yaml:/etc/otelcol-contrib/custom.config.yaml:ro
      - hyperdx_db:/data/db
      - hyperdx_ch_data:/var/lib/clickhouse
      - hyperdx_ch_logs:/var/log/clickhouse-server

  otelcol:
    profiles: ["observability"]
    image: ${OTELCOL_IMAGE}
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otelcol.config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      phoenix:
        condition: service_started
      hyperdx:
        condition: service_started

  tailscale:
    image: ${TAILSCALE_IMAGE}
    # polypus deploy sets POLYPUS_TS_HOSTNAME to polypus-<identifier>, the environment's tailnet host.
    hostname: ${POLYPUS_TS_HOSTNAME:?run through polypus deploy}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "true"
      TS_HOSTNAME: ${POLYPUS_TS_HOSTNAME:?run through polypus deploy}
    volumes:
      - tailscale_state:/var/lib/tailscale
      # serve.json, rendered per deploy with the observability forwards only when they run.
      - ${POLYPUS_TS_SERVE_DIR:?run through polypus deploy}:/config
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  switchyard_routes:
  polypus_state:
  polypus_inference_failures:
  switchyard_inference_failures:
  phoenix_data:
  hyperdx_db:
  hyperdx_ch_data:
  hyperdx_ch_logs:
  tailscale_state:

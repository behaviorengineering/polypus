receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

connectors:
  routing:
    # otelcol 0.120.x routing table does not support action: copy; fan out with two pipelines per row.
    default_pipelines: [traces/hyperdx]
    table:
      - context: span
        condition: attributes["openinference.span.kind"] != nil or attributes["gen_ai.system"] != nil or attributes["gen_ai.operation.name"] != nil
        pipelines: [traces/phoenix, traces/hyperdx]

exporters:
  otlp/phoenix:
    endpoint: phoenix:4317
    tls:
      insecure: true
  otlphttp/hyperdx:
    endpoint: http://hyperdx:4318

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [routing]
    traces/phoenix:
      receivers: [routing]
      exporters: [otlp/phoenix]
    traces/hyperdx:
      receivers: [routing]
      exporters: [otlphttp/hyperdx]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/hyperdx]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/hyperdx]

# Polypus hybrid router (local): Cloudflare chat via in-process extension + LM Studio for OCR/embeddings.
# INFERENCE_CLOUD_CASE=1 in stack/.env enables cf_local remote backend.
# HTTP clients call Polypus gateway :1320 only.
#
# models.allow is the enable list (GET /v1/models + inference POSTs).
# Use GET /v1/models?view=inventory for full upstream inventory (pre-allow).

default_tts_backend: cf_local
default_stt_backend: cf_local
default_proxy_backend: cf_local
default_chat_backend: cf_local
default_vision_backend: cf_local
default_embed_backend: lm_studio

timeouts:
  min: 5s
  max: 900s
  chat: 120s
  chat_thinking: 600s
  vision: 300s
  embed: 60s
  speech: 180s
  backends:
    cf_local:
      chat: 60s

policy:
  reject_non_loopback_backends: true
  require_cloud_opt_in: true

backends:
  cf_local:
    remote: true
    extension: cloudflare
    base_url: https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/ai/v1
    auth:
      bearer_env: CF_AI_API_KEY
    capabilities: [chat, vision, tts, stt, voices]
    models:
      sync: true
      allow:
        - "@cf/qwen/qwen3-30b-a3b-fp8"
        - "@cf/zai-org/glm-4.7-flash"
        - "@cf/ibm-granite/granite-4.0-h-micro"
        - "@cf/google/gemma-4-26b-a4b-it"
        - "@cf/deepgram/aura-2-en"
        - "@cf/deepgram/nova-3"
  lm_studio:
    base_url: http://127.0.0.1:1234/v1
    capabilities: [chat, vision, embed]
    models:
      sync: true
      allow:
        - "allenai/olmocr-2-7b"
        - "text-embedding-nomic-embed-text-v1.5"
        - "bge-base-en-v1.5"
        - "gemma-4-e4b-it"
        - "ornith-1.0-9b"
        - "qwen3-vl-4b-instruct"
        - "qwen3.5-9b"

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master as of 2026-11-07
        with:
          toolchain: 1.96.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: providers/switchyard

      # Installs into bin/, where the Switchyard fallback integration test reads it.
      - name: Build switchyard-server
        run: |
          cargo install --locked --path providers/switchyard/crates/switchyard-server --root .
          test -x bin/switchyard-server

      - name: Verify modules tidy
        run: |
          cp go.mod go.mod.bak && cp go.sum go.sum.bak
          go mod tidy
          diff -u go.mod.bak go.mod
          diff -u go.sum.bak go.sum
          rm -f go.mod.bak go.sum.bak

      - name: Config example drift
        run: go tool task check-config-example

      - name: Release decide tests
        run: bash scripts/ci/auto-patch-decide_test.sh

      - name: gofumpt
        run: |
          unformatted=$(go tool gofumpt -l ./cmd ./internal ./pkg)
          if [ -n "$unformatted" ]; then
            echo "gofumpt needed (go tool task format):"
            echo "$unformatted"
            exit 1
          fi

      - name: golangci-lint
        run: go tool golangci-lint run --timeout 5m ./cmd/... ./internal/... ./pkg/...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: Switchyard fallback integration
        run: go test -tags=integration -count=1 ./internal/switchyard/...

      - name: go build
        run: go build ./...

  smoke:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs: quality
    env:
      CF_AI_API_KEY: ${{ secrets.CF_AI_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Hermetic integration smoke (PR)
        if: github.event_name == 'pull_request'
        run: go test -tags=integration -count=1 -timeout 15m ./internal/smoke/integration/...

      - name: Require Cloudflare secrets (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -z "$CF_AI_API_KEY" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "CF_AI_API_KEY and CF_ACCOUNT_ID secrets are required for main live smoke" >&2
            exit 1
          fi

      - name: Live integration smoke (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          POLYPUS_SMOKE_LIVE: "1"
        run: go test -tags=integration -count=1 -timeout 25m ./internal/smoke/integration/...

name: Packaging rebuild

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "App release tag (vX.Y.Z)"
        required: true
        type: string
      image_revision:
        description: "Rebuild counter N (optional; auto when empty)"
        required: false
        type: string
        default: ""
      checkout_ref:
        description: "Git ref for Docker context (default workflow SHA)"
        required: false
        type: string
        default: ""
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  decide:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      app_tag: ${{ steps.plan.outputs.app_tag }}
      image_revision: ${{ steps.plan.outputs.image_revision }}
      checkout_ref: ${{ steps.plan.outputs.checkout_ref }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Packaging-only gate (workflow_run)
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          chmod +x scripts/ci/packaging-only-since-tag.sh
          scripts/ci/packaging-only-since-tag.sh

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Plan rebuild
        id: plan
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          DISPATCH_REV: ${{ github.event.inputs.image_revision }}
          DISPATCH_CHECKOUT: ${{ github.event.inputs.checkout_ref }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW="${DISPATCH_TAG}"
          else
            RAW="$(git describe --tags --abbrev=0 --match 'v*')"
          fi
          if [[ ! "$RAW" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid app tag: $RAW" >&2
            exit 1
          fi
          APP_VER="${RAW#v}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${DISPATCH_REV}" ]]; then
            if [[ ! "${DISPATCH_REV}" =~ ^[1-9][0-9]*$ ]]; then
              echo "image_revision must be a positive integer" >&2
              exit 1
            fi
            REV="${DISPATCH_REV}"
          else
            REV=""
          fi
          if [[ -z "$REV" ]]; then
            IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/polypus"
            REV=1
            for n in $(seq 1 100); do
              if docker buildx imagetools inspect "${IMAGE}:${APP_VER}-r${n}" >/dev/null 2>&1; then
                REV=$((n + 1))
              else
                REV=$n
                break
              fi
            done
            if [[ "$REV" -gt 100 ]]; then
              echo "exceeded rebuild revision cap (100)" >&2
              exit 1
            fi
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${DISPATCH_CHECKOUT}" ]]; then
            CHECKOUT="${DISPATCH_CHECKOUT}"
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            CHECKOUT="${{ github.event.workflow_run.head_sha }}"
          else
            CHECKOUT="${GITHUB_SHA}"
          fi
          {
            echo "skip=false"
            echo "app_tag=${RAW}"
            echo "image_revision=${REV}"
            echo "checkout_ref=${CHECKOUT}"
          } >> "$GITHUB_OUTPUT"

  docker:
    needs: decide
    if: needs.decide.outputs.skip != 'true'
    uses: ./.github/workflows/docker-release.yml
    with:
      version: ${{ needs.decide.outputs.app_tag }}
      image_revision: ${{ needs.decide.outputs.image_revision }}
      checkout_ref: ${{ needs.decide.outputs.checkout_ref }}
      move_latest: false
    secrets: inherit

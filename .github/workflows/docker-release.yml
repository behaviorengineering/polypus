name: Docker release

on:
  workflow_call:
    inputs:
      version:
        description: "Release tag (v0.2.26)"
        required: true
        type: string
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (v0.2.26)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release ref
        id: release
        run: |
          set -euo pipefail
          RAW=""
          # Reusable workflows from auto-patch may report workflow_run; inputs.version is set.
          if [[ -n "${{ inputs.version }}" ]]; then
            RAW="${{ inputs.version }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW="${{ github.event.inputs.tag }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$RAW" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "refusing non-semver tag: $RAW (expected vX.Y.Z)" >&2
            exit 1
          fi
          VER="${RAW#v}"
          echo "ref=${RAW}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ steps.release.outputs.ref }}

      - name: Docker meta
        id: meta
        run: |
          echo "version=${{ steps.release.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER}/polypus" >> "$GITHUB_OUTPUT"
          echo "switchyard_image=ghcr.io/${GITHUB_REPOSITORY_OWNER}/polypus-switchyard" >> "$GITHUB_OUTPUT"

      - name: Download release binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.ref }}
        run: |
          set -euo pipefail
          mkdir -p docker-bin release-assets
          gh release download "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "polypus_${VER}_linux_amd64.tar.gz" \
            --pattern "polypus-switchyard_${VER}_linux_amd64.tar.gz" \
            --dir release-assets
          gw=(release-assets/polypus_"${VER}"_linux_amd64.tar.gz)
          sy=(release-assets/polypus-switchyard_"${VER}"_linux_amd64.tar.gz)
          if [ "${#gw[@]}" -ne 1 ] || [ "${#sy[@]}" -ne 1 ]; then
            echo "expected exactly one gateway and one switchyard archive" >&2
            ls -la release-assets >&2 || true
            exit 1
          fi
          tar -xzf "${gw[0]}" -C docker-bin polypus
          tar -xzf "${sy[0]}" -C docker-bin switchyard-server
          chmod +x docker-bin/polypus docker-bin/switchyard-server
          test -x docker-bin/polypus
          test -x docker-bin/switchyard-server

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push polypus gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest

      - name: Build and push switchyard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.switchyard
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.switchyard_image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.switchyard_image }}:latest

      - name: Verify GHCR manifests
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
          docker buildx imagetools inspect "${{ steps.meta.outputs.switchyard_image }}:${{ steps.meta.outputs.version }}"

name: Docker release

on:
  workflow_call:
    inputs:
      version:
        description: "Image version (v0.2.26 or 0.2.26)"
        required: true
        type: string
      git_ref:
        description: "Git ref to build (tag name or branch)"
        required: false
        type: string
        default: main
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image version (v0.2.26 or 0.2.26)"
        required: true
        type: string
      git_ref:
        description: "Git ref to build (default main; use when the release tag predates docker fixes)"
        required: false
        default: main
        type: string

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release ref
        id: release
        run: |
          if [[ "${{ github.event_name }}" == "workflow_call" ]]; then
            RAW="${{ inputs.version }}"
            VER="${RAW#v}"
            echo "ref=${{ inputs.git_ref }}" >> "$GITHUB_OUTPUT"
            echo "version=${VER}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW="${{ github.event.inputs.tag }}"
            VER="${RAW#v}"
            echo "ref=${{ github.event.inputs.git_ref }}" >> "$GITHUB_OUTPUT"
            echo "version=${VER}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ steps.release.outputs.ref }}

      - name: Docker meta
        id: meta
        run: |
          echo "version=${{ steps.release.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER}/polypus" >> "$GITHUB_OUTPUT"
          echo "switchyard_image=ghcr.io/${GITHUB_REPOSITORY_OWNER}/polypus-switchyard" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push polypus gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest

      - name: Build and push switchyard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.switchyard
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.switchyard_image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.switchyard_image }}:latest

# Auto patch release (agent-oriented)
#
# After CI succeeds on main, create vX.Y.(Z+1) and publish binaries via GoReleaser
# plus GHCR images, unless decide script skips (docs/chore/ci, harness-only, [skip release]).
#
# Manual bump (minor/major/patch): workflow_dispatch.
# release.yml still runs if a human pushes a v* tag that triggers workflows.

name: Auto patch release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump level
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  packages: write

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: providers/switchyard

      - name: Gate switchyard build (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        working-directory: providers/switchyard
        run: cargo build --release -p switchyard-server

      - name: Gate Go tests (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: go test -count=1 ./internal/gateway/...

  release:
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      new_tag: ${{ steps.decide.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Decide whether to tag
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name == 'workflow_run' && 'push' || github.event_name }}
          MANUAL_BUMP: ${{ github.event.inputs.bump }}
          HEAD_MSG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_commit.message || '' }}
        run: bash .cursor/packs/shared/scripts/auto-patch-decide.sh

      - name: Skip notice
        if: steps.decide.outputs.skip == 'true'
        run: |
          echo "Skipping auto release: ${{ steps.decide.outputs.reason }}"

      - uses: actions/setup-go@v5
        if: steps.decide.outputs.skip != 'true'
        with:
          go-version-file: go.mod
          cache: true

      - uses: dtolnay/rust-toolchain@master
        if: steps.decide.outputs.skip != 'true'
        with:
          toolchain: 1.96.1

      - uses: Swatinem/rust-cache@v2
        if: steps.decide.outputs.skip != 'true'
        with:
          workspaces: providers/switchyard

      - name: Create and push tag
        if: steps.decide.outputs.skip != 'true'
        env:
          NEW_TAG: ${{ steps.decide.outputs.new_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${NEW_TAG}" -m "Release ${NEW_TAG}"
          git push origin "refs/tags/${NEW_TAG}"

      - uses: goreleaser/goreleaser-action@v6
        if: steps.decide.outputs.skip != 'true'
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and upload switchyard linux/amd64 archive
        if: steps.decide.outputs.skip != 'true'
        env:
          NEW_TAG: ${{ steps.decide.outputs.new_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="${NEW_TAG#v}"
          cargo build --release -p switchyard-server --manifest-path providers/switchyard/Cargo.toml
          mkdir -p dist
          cp providers/switchyard/target/release/switchyard-server "dist/switchyard-server"
          ARCHIVE="dist/polypus-switchyard_${VER}_linux_amd64.tar.gz"
          tar -czf "$ARCHIVE" -C dist switchyard-server
          sha256sum "$ARCHIVE" | tee "dist/polypus-switchyard_${VER}_linux_amd64.sha256"
          gh release upload "${NEW_TAG}" "$ARCHIVE" "dist/polypus-switchyard_${VER}_linux_amd64.sha256" --clobber

  docker:
    needs: release
    if: needs.release.outputs.skip != 'true'
    uses: ./.github/workflows/docker-release.yml
    with:
      version: ${{ needs.release.outputs.new_tag }}
    secrets: inherit

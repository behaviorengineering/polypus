# Auto patch release (agent-oriented)
#
# After CI succeeds on main, create vX.Y.(Z+1) and publish binaries via GoReleaser
# plus GHCR images, unless decide script skips (docs/chore/ci, harness-only, [skip release]).
#
# Manual bump (minor/major/patch): workflow_dispatch from main only; it first runs
# go tool task ci and builds switchyard-server.
# No other workflow releases: a hand-pushed v* tag builds no binaries or images.

name: Auto patch release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump level
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

# Read-only by default; each job that writes asks for exactly what it writes.
permissions:
  contents: read

jobs:
  # Release only from a green push to this repo's main, or a manual bump dispatched
  # from main. The branches filter on workflow_run matches by name, so a fork PR from
  # a branch called main would otherwise get its head_sha tagged and released.
  # A workflow_run has already passed CI, so only a manual bump runs the gate steps.
  # No permissions block: cargo build runs every dependency's build.rs, so this job
  # keeps the workflow's read-only token.
  gate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Gate passed by CI (workflow_run)
        if: github.event_name == 'workflow_run'
        run: echo "CI passed on ${{ github.event.workflow_run.head_sha }}; no manual gate to run."

      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        if: github.event_name == 'workflow_dispatch'
        with:
          go-version-file: go.mod
          cache: true

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master as of 2026-11-07
        if: github.event_name == 'workflow_dispatch'
        with:
          toolchain: 1.96.1

      - uses: Swatinem/rust-cache@v2
        if: github.event_name == 'workflow_dispatch'
        with:
          workspaces: providers/switchyard

      - name: Gate switchyard build (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        working-directory: providers/switchyard
        run: cargo build --release -p switchyard-server

      - name: Gate module CI (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: go tool task ci

  release:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write # git push of the v* tag and the GoReleaser release (no GHCR in .goreleaser.yaml)
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      new_tag: ${{ steps.decide.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Decide whether to tag
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name == 'workflow_run' && 'push' || github.event_name }}
          MANUAL_BUMP: ${{ github.event.inputs.bump }}
          HEAD_MSG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_commit.message || '' }}
          # Paths that never change the shipped binaries or images: agent harness,
          # docs, the website and the release scripts themselves.
          AUTO_PATCH_EXTRA_HARNESS_PATHS: ".cursor/* ai-copilots/* docs/* site/* scripts/ci/auto-patch-*"
          AUTO_PATCH_EXTRA_PACKAGING_PATHS: "docker-bake.hcl scripts/ci/switchyard-smoke-routes.toml"
        run: bash scripts/ci/auto-patch-decide.sh

      - name: Skip notice
        if: steps.decide.outputs.skip == 'true'
        run: |
          echo "Skipping auto release: ${{ steps.decide.outputs.reason }}"

      - uses: actions/setup-go@v5
        if: steps.decide.outputs.skip != 'true'
        with:
          go-version-file: go.mod
          cache: true

      - name: Create and push tag
        if: steps.decide.outputs.skip != 'true'
        env:
          NEW_TAG: ${{ steps.decide.outputs.new_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${NEW_TAG}" -m "Release ${NEW_TAG}"
          git push origin "refs/tags/${NEW_TAG}"

      - uses: goreleaser/goreleaser-action@v6
        if: steps.decide.outputs.skip != 'true'
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Switchyard builds natively per arch: arm64 hosted runners are free for public repos.
  switchyard:
    needs: release
    if: needs.release.outputs.skip != 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # gh release upload
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.release.outputs.new_tag }}

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master as of 2026-11-07
        with:
          toolchain: 1.96.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: providers/switchyard
          key: ${{ matrix.arch }}

      - name: Build and upload switchyard linux/${{ matrix.arch }} archive
        env:
          NEW_TAG: ${{ needs.release.outputs.new_tag }}
          ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="${NEW_TAG#v}"
          cargo build --release -p switchyard-server --manifest-path providers/switchyard/Cargo.toml
          mkdir -p dist
          cp providers/switchyard/target/release/switchyard-server "dist/switchyard-server"
          ARCHIVE="dist/polypus-switchyard_${VER}_linux_${ARCH}.tar.gz"
          tar -czf "$ARCHIVE" -C dist switchyard-server
          sha256sum "$ARCHIVE" | tee "dist/polypus-switchyard_${VER}_linux_${ARCH}.sha256"
          gh release upload "${NEW_TAG}" "$ARCHIVE" "dist/polypus-switchyard_${VER}_linux_${ARCH}.sha256" --clobber

  docker:
    needs: [release, switchyard]
    if: needs.release.outputs.skip != 'true'
    # A called workflow gets at most what this job grants: it reads the release
    # assets and pushes the images to GHCR.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-release.yml
    with:
      version: ${{ needs.release.outputs.new_tag }}
    secrets: inherit

  verify:
    needs: [release, docker]
    if: needs.release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GHCR manifests for release tag
        env:
          NEW_TAG: ${{ needs.release.outputs.new_tag }}
        run: |
          set -euo pipefail
          VER="${NEW_TAG#v}"
          GW="ghcr.io/${GITHUB_REPOSITORY_OWNER}/polypus:${VER}"
          SY="ghcr.io/${GITHUB_REPOSITORY_OWNER}/polypus-switchyard:${VER}"
          for ref in "$GW" "$SY"; do
            manifest="$(docker buildx imagetools inspect "$ref")"
            printf '%s\n' "$manifest"
            for p in linux/amd64 linux/arm64; do
              if ! grep -qE "Platform:[[:space:]]+${p}\$" <<<"$manifest"; then
                echo "${ref} is missing platform ${p}" >&2
                exit 1
              fi
            done
          done

  ci-failure:
    needs: [gate, release, switchyard, docker, verify]
    if: >-
      always() &&
      (
        needs.gate.result == 'failure' ||
        (
          needs.release.outputs.skip != 'true' &&
          (
            needs.release.result == 'failure' ||
            needs.switchyard.result == 'failure' ||
            needs.docker.result == 'failure' ||
            needs.verify.result == 'failure'
          )
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # gh issue list and create, gh label create
      actions: read # gh run view --log-failed
    steps:
      - name: Open ci-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          COUNT="$(gh issue list --repo "${GITHUB_REPOSITORY}" --label ci-failure --state open --search "${RUN_URL}" --json number --jq 'length')"
          if [ "${COUNT}" != "0" ]; then
            echo "Issue already open for this run"
            exit 0
          fi
          EXCERPT="$(gh run view "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --log-failed 2>/dev/null | tail -n 80 || true)"
          if [ -z "$EXCERPT" ]; then
            EXCERPT="(no failed log excerpt; inspect the run URL)"
          fi
          BODY_FILE="$(mktemp)"
          {
            echo "Auto patch release pipeline failed."
            echo
            echo "- Workflow: ${GITHUB_WORKFLOW}"
            echo "- Run: ${RUN_URL}"
            echo "- Ref: ${GITHUB_REF}"
            echo
            echo "## Failed log excerpt"
            echo
            echo '```'
            echo "$EXCERPT"
            echo '```'
            echo
            echo "Fix CI or re-run Docker release, then confirm **verify** is green before bumping consumer pins (images.env, submodule). See manage-go-releases publish-complete gate."
          } >"$BODY_FILE"
          gh label create ci-failure --repo "${GITHUB_REPOSITORY}" --color B60205 --description "Release or auto-patch CI failure" 2>/dev/null || true
          gh issue create --repo "${GITHUB_REPOSITORY}" --label ci-failure --title "CI failed: ${GITHUB_WORKFLOW} (${GITHUB_RUN_ID})" --body-file "$BODY_FILE"
          rm -f "$BODY_FILE"

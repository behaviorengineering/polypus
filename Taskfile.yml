version: "3"

dotenv: ["ports.env", "images.env"]

vars:
  VERSION: '{{.VERSION | default "dev"}}'
  BINARY: bin/polypus{{exeExt}}
  SMOKE_BIN: bin/polypus-smoke{{exeExt}}
  GO_BUILDFLAGS: "-buildvcs=false"
  LDFLAGS: "-X github.com/behaviorengineering/polypus/internal/buildinfo.Version={{.VERSION}}"
  INTEGRATION_PKG: ./internal/smoke/integration
  THEME_ACCENT: '{{.OPERATOR_CLI_THEME_ACCENT | default "42"}}'
  THEME_MARK: '{{.OPERATOR_CLI_THEME_MARK | default "214"}}'

env:
  FORCE_COLOR: "1"
  TASK_COLOR: "true"
  TASK_COLOR_GREEN: "38;5;{{.THEME_ACCENT}}"
  TASK_COLOR_YELLOW: "38;5;{{.THEME_MARK}}"
  TASK_COLOR_CYAN: "38;5;{{.THEME_MARK}}"

tasks:
  default:
    desc: List local-dev tasks
    summary: "Prints go tool task --list and the four first steps."
    silent: true
    cmds:
      - go tool task --list
      - |
        echo ""
        echo "Next steps:"
        echo "  1. go tool task init"
        echo "  2. go tool task serve"
        echo "  3. go tool task smoke-all"
        echo "  4. POLYPUS_SMOKE_OTEL=1 go tool task smoke-otel"

  build:
    desc: Build gateway and switchyard-server binaries
    summary: "Builds bin/polypus (go build) and bin/switchyard-server (cargo install from providers/switchyard). Needs Go and a Rust toolchain."
    deps: [build-gateway, switchyard-build]

  serve:
    desc: process-compose TUI (gateway, backends, optional observability)
    summary: "Builds, then starts the process-compose stack via scripts/pc-up.sh. Needs a POSIX shell and process-compose."
    deps: [build]
    cmds:
      - ./scripts/pc-up.sh

  serve-down:
    desc: Stop this process-compose project only
    summary: "Stops this repo's process-compose project via scripts/pc-down.sh. Leaves Docker volumes alone."
    cmds:
      - ./scripts/pc-down.sh

  init:
    desc: Write XDG config from example via polypus init
    summary: "Builds the gateway, then runs polypus init to write ~/.config/polypus/config.yaml from the example."
    deps: [build-gateway]
    cmds:
      - '{{.BINARY}} init'

  test:
    desc: Unit tests (excludes integration tag)
    summary: "go test ./... (unit tests only; the integration tag is excluded)."
    cmds:
      - go test ./...

  vet:
    desc: Run go vet
    summary: "go vet ./..."
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint on cmd, internal, and pkg
    summary: "go tool golangci-lint over cmd, internal and pkg with .golangci.yml."
    cmds:
      - go tool golangci-lint run --timeout 5m ./cmd/... ./internal/... ./pkg/...

  format:
    desc: Format Go sources with gofumpt
    summary: "go tool gofumpt -w over cmd, internal and pkg (rewrites files)."
    cmds:
      - go tool gofumpt -w ./cmd ./internal ./pkg

  tidy:
    desc: Run go mod tidy
    summary: "go mod tidy (rewrites go.mod and go.sum)."
    cmds:
      - go mod tidy

  ci:
    desc: Module CI checks (tidy, gofumpt, vet, lint, race tests, build)
    summary: "The local twin of CI quality: tidy check, config example drift, gofumpt check, vet, lint, race tests, build."
    cmds:
      - go mod tidy -diff
      - task: check-config-example
      - |
        unformatted=$(go tool gofumpt -l ./cmd ./internal ./pkg)
        if [ -n "$unformatted" ]; then
          echo "gofumpt needed (go tool task format):"
          echo "$unformatted"
          exit 1
        fi
      - go vet ./...
      - task: lint
      - go test -race -count=1 ./...
      - go build {{.GO_BUILDFLAGS}} ./...

  mlx-sync:
    desc: uv sync for MLX backends
    summary: "Runs backends/mlx/scripts/sync.sh (uv sync for the MLX backends). Apple silicon only."
    cmds:
      - ./backends/mlx/scripts/sync.sh

  build-smoke:
    desc: Build polypus-smoke CLI
    summary: "Builds bin/polypus-smoke. Run probes with bin/polypus-smoke run (paid calls)."
    deps: [build-smoke-bin]

  docker-build:
    desc: Build the gateway image for this machine as polypus:dev
    summary: "Cross-builds the gateway for linux/<this arch> into docker-bin/, then bakes the gateway target of docker-bake.hcl and loads polypus:dev. Needs Docker with buildx; the Switchyard image comes from release CI."
    env:
      GOOS: linux
      CGO_ENABLED: "0"
      PLATFORMS: linux/{{ARCH}}
    cmds:
      - go build {{.GO_BUILDFLAGS}} -ldflags "{{.LDFLAGS}}" -o docker-bin/{{ARCH}}/polypus ./cmd/polypus
      - docker buildx bake -f docker-bake.hcl gateway --load

  smoke-tts:
    desc: Integration smoke TTS
    summary: "Runs go test -tags=integration against hermetic mocks in internal/smoke/integration (15m timeout). TTS through the Cloudflare mock. Alias: smoke."
    aliases: [smoke]
    cmds:
      - go test -tags=integration -count=1 -timeout 15m {{.INTEGRATION_PKG}} -run '^TestSmokeTTS$'

  smoke-local:
    desc: Integration smoke TTS (MLX local)
    summary: "Runs go test -tags=integration against hermetic mocks in internal/smoke/integration (15m timeout). TTS through the local MLX mock."
    cmds:
      - go test -tags=integration -count=1 -timeout 15m {{.INTEGRATION_PKG}} -run '^TestSmokeTTSLocal$'

  smoke-chat:
    desc: Integration smoke chat
    summary: "Runs go test -tags=integration against hermetic mocks in internal/smoke/integration (15m timeout). Chat."
    cmds:
      - go test -tags=integration -count=1 -timeout 15m {{.INTEGRATION_PKG}} -run '^TestSmokeChat$'

  smoke-router:
    desc: Integration smoke router
    summary: "Runs go test -tags=integration against hermetic mocks in internal/smoke/integration (15m timeout). A named router through the Switchyard mock."
    cmds:
      - go test -tags=integration -count=1 -timeout 15m {{.INTEGRATION_PKG}} -run '^TestSmokeRouter$'

  smoke-landing:
    desc: Integration smoke gateway landing
    summary: "Runs go test -tags=integration against hermetic mocks in internal/smoke/integration (15m timeout). The gateway landing page."
    cmds:
      - go test -tags=integration -count=1 -timeout 15m {{.INTEGRATION_PKG}} -run '^TestGatewayLanding$'

  smoke-batch:
    desc: Integration smoke batch
    summary: "Runs go test -tags=integration against hermetic mocks in internal/smoke/integration (15m timeout). Batch create, poll and output."
    cmds:
      - go test -tags=integration -count=1 -timeout 15m {{.INTEGRATION_PKG}} -run '^TestSmokeBatch$'

  smoke-higgs:
    desc: Integration smoke Higgs TTS
    summary: "Runs go test -tags=integration against hermetic mocks in internal/smoke/integration (15m timeout). Higgs TTS; writes /tmp/polypus-higgs-smoke.mp3."
    env:
      POLYPUS_SMOKE_OUT: /tmp/polypus-higgs-smoke.mp3
    cmds:
      - go test -tags=integration -count=1 -timeout 15m {{.INTEGRATION_PKG}} -run '^TestSmokeHiggs$'

  smoke-stt:
    desc: Integration smoke STT
    summary: "Runs go test -tags=integration against hermetic mocks in internal/smoke/integration (15m timeout). STT through the Cloudflare mock."
    cmds:
      - go test -tags=integration -count=1 -timeout 15m {{.INTEGRATION_PKG}} -run '^TestSmokeSTT$'

  smoke-stt-local:
    desc: Integration smoke STT (MLX local)
    summary: "Runs go test -tags=integration against hermetic mocks in internal/smoke/integration (15m timeout). STT through the local MLX mock."
    cmds:
      - go test -tags=integration -count=1 -timeout 15m {{.INTEGRATION_PKG}} -run '^TestSmokeSTTLocal$'

  smoke-systemone:
    desc: Integration smoke systemone
    summary: "Runs go test -tags=integration against hermetic mocks in internal/smoke/integration (15m timeout). SystemOne decisions."
    cmds:
      - go test -tags=integration -count=1 -timeout 15m {{.INTEGRATION_PKG}} -run '^TestSmokeSystemOne$'

  smoke-all:
    desc: Run all integration smokes
    summary: "Runs go test -tags=integration against hermetic mocks in internal/smoke/integration (15m timeout). Every channel in one run."
    cmds:
      - go test -tags=integration -count=1 -timeout 15m {{.INTEGRATION_PKG}} -run '^TestSmokeAll$'

  smoke-otel:
    desc: Integration smoke OTLP fan-out
    summary: "Runs go test -tags=integration against hermetic mocks in internal/smoke/integration (15m timeout). OTLP fan-out (POLYPUS_SMOKE_OTEL=1)."
    env:
      POLYPUS_SMOKE_OTEL: "1"
    cmds:
      - go test -tags=integration -count=1 -timeout 15m {{.INTEGRATION_PKG}} -run '^TestSmokeOtelFanout$'

  sync-config-example:
    internal: true
    cmds:
      - cp config.yaml.example internal/config/config.yaml.example

  check-config-example:
    internal: true
    cmds:
      - |
        if [ ! -f internal/config/config.yaml.example ]; then
          echo "missing internal/config/config.yaml.example; run: go tool task sync-config-example" >&2
          exit 1
        fi
        if ! cmp -s config.yaml.example internal/config/config.yaml.example; then
          echo "config example drift: edit config.yaml.example then go tool task sync-config-example" >&2
          exit 1
        fi

  build-gateway:
    internal: true
    deps: [sync-config-example]
    cmds:
      - go build {{.GO_BUILDFLAGS}} -ldflags "{{.LDFLAGS}}" -o {{.BINARY}} ./cmd/polypus

  build-smoke-bin:
    internal: true
    cmds:
      - go build {{.GO_BUILDFLAGS}} -o {{.SMOKE_BIN}} ./cmd/polypus-smoke

  switchyard-build:
    internal: true
    cmds:
      - |
        if [ ! -f providers/switchyard/Cargo.toml ]; then
          echo "switchyard-build: missing providers/switchyard (run: git submodule update --init providers/switchyard)" >&2
          exit 1
        fi
        if ! command -v cargo >/dev/null 2>&1; then
          echo "switchyard-build: cargo not found; install a Rust toolchain" >&2
          exit 1
        fi
        cargo install --locked --force --path providers/switchyard/crates/switchyard-server --root .
        if [ ! -x bin/switchyard-server ]; then
          echo "switchyard-build: expected executable bin/switchyard-server after cargo install" >&2
          exit 1
        fi

  install:
    internal: true
    cmds:
      - go build {{.GO_BUILDFLAGS}} -ldflags "{{.LDFLAGS}}" -o {{.GOPATH}}/bin/polypus{{exeExt}} ./cmd/polypus
    vars:
      GOPATH:
        sh: go env GOPATH

  test-integration:
    internal: true
    cmds:
      - go test -tags=integration -count=1 -timeout 15m {{.INTEGRATION_PKG}}

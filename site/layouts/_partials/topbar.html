{{- $docs := hasPrefix .RelPermalink (site.GetPage "/docs").RelPermalink -}}
<header class="topbar">
  <div class="topbar__inner">
    <a class="wordmark" href="{{ site.Home.RelPermalink }}">
      <span class="wordmark__mark">{{ (resources.Get "polypus-eye.svg").Content | safeHTML }}</span>
      <span class="wordmark__name">polypus</span>
    </a>
    <nav class="topbar__links" aria-label="Site">
      <a href="{{ (site.GetPage "/docs").RelPermalink }}"{{ if $docs }} aria-current="page"{{ end }}>Docs</a>
      <a href="{{ (site.GetPage "/docs/setup").RelPermalink }}">Run your own</a>
      <a href="{{ (site.GetPage "/docs/switchyard").RelPermalink }}">Routers</a>
    </nav>
    <div class="topbar__tools">
      <a class="tool" href="{{ site.Params.repo }}" aria-label="Polypus on GitHub">{{ partial "github.html" . }}</a>
      <button class="tool theme-toggle" type="button" aria-label="Colour theme: auto">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>
        <span class="theme-toggle__label">Auto</span>
      </button>
    </div>
  </div>
</header>

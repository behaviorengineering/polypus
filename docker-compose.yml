# Observability containers (process-compose via scripts/pc-phoenix.sh / pc-hyperdx.sh).
# Host gateway: make serve (process-compose).
# Phoenix: POLYPUS_PHOENIX=1 (default). HyperDX: POLYPUS_HYPERDX=1 (default).
# OTLP: Phoenix keeps host :4317 (OpenInference). HyperDX uses :4319 (gRPC) and :4318 (HTTP).
# HyperDX OTel table TTL: HYPERDX_OTEL_EXPORTER_TABLES_TTL (default 1h). ClickStack ignores
# custom exporter overrides for the built-in clickhouse exporter; use the env var instead.
# Set HYPERDX_OTEL_EXPORTER_RECONCILE_TABLE_TTL=true once to rewrite existing table TTLs.
services:
  phoenix:
    image: ${PHOENIX_IMAGE:-arizephoenix/phoenix:latest}
    container_name: polypus-phoenix
    restart: "no"
    ports:
      - "${PHOENIX_PORT:-6006}:6006"
      - "${PHOENIX_OTLP_PORT:-4317}:4317"
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix_data:/data

  hyperdx:
    image: ${HYPERDX_IMAGE:-clickhouse/clickstack-local:latest}
    container_name: polypus-hyperdx
    restart: "no"
    environment:
      HYPERDX_OTEL_EXPORTER_TABLES_TTL: ${HYPERDX_OTEL_EXPORTER_TABLES_TTL:-1h}
      HYPERDX_OTEL_EXPORTER_RECONCILE_TABLE_TTL: ${HYPERDX_OTEL_EXPORTER_RECONCILE_TABLE_TTL:-false}
    ports:
      - "${HYPERDX_PORT:-8080}:8080"
      - "${HYPERDX_OTLP_GRPC_PORT:-4319}:4317"
      - "${HYPERDX_OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ./hyperdx.clickhouse.config.xml:/etc/clickhouse-server/config.d/99-polypus-system-log-retention.xml:ro
      - hyperdx_db:/data/db
      - hyperdx_ch_data:/var/lib/clickhouse
      - hyperdx_ch_logs:/var/log/clickhouse-server

volumes:
  phoenix_data:
  hyperdx_db:
  hyperdx_ch_data:
  hyperdx_ch_logs:

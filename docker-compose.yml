# Observability containers (process-compose via scripts/pc-*.sh).
# Host gateway: go tool task serve (process-compose).
# Phoenix: POLYPUS_PHOENIX=1 (default). HyperDX: POLYPUS_HYPERDX=1 (default). OTel fan-out: otelcol.
# OTLP ingest on host :4317 (gRPC) and :4318 (HTTP) via otelcol; routes all traces to HyperDX and
# OpenInference / gen_ai.* spans to Phoenix. UIs: Phoenix :6006, HyperDX :8080.
# HyperDX OTel table TTL: HYPERDX_OTEL_EXPORTER_TABLES_TTL (default 1h). ClickStack ignores
# custom exporter overrides for the built-in clickhouse exporter; use the env var instead.
# Set HYPERDX_OTEL_EXPORTER_RECONCILE_TABLE_TTL=true once to rewrite existing table TTLs.
services:
  phoenix:
    image: ${PHOENIX_IMAGE:-arizephoenix/phoenix:latest}
    container_name: polypus-phoenix
    restart: "no"
    ports:
      - "${PHOENIX_PORT:-6006}:6006"
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix_data:/data

  hyperdx:
    image: ${HYPERDX_IMAGE:-clickhouse/clickstack-local:2.10.0}
    container_name: polypus-hyperdx
    restart: "no"
    environment:
      HYPERDX_OTEL_EXPORTER_TABLES_TTL: ${HYPERDX_OTEL_EXPORTER_TABLES_TTL:-1h}
      HYPERDX_OTEL_EXPORTER_RECONCILE_TABLE_TTL: ${HYPERDX_OTEL_EXPORTER_RECONCILE_TABLE_TTL:-false}
    ports:
      - "${HYPERDX_PORT:-8080}:8080"
    volumes:
      - ./hyperdx.clickhouse.config.xml:/etc/clickhouse-server/config.d/99-polypus-system-log-retention.xml:ro
      - hyperdx_db:/data/db
      - hyperdx_ch_data:/var/lib/clickhouse
      - hyperdx_ch_logs:/var/log/clickhouse-server

  otelcol:
    image: ${OTELCOL_IMAGE:-otel/opentelemetry-collector-contrib:0.120.0}
    container_name: polypus-otelcol
    restart: "no"
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "${OTELCOL_OTLP_GRPC_PORT:-4317}:4317"
      - "${OTELCOL_OTLP_HTTP_PORT:-4318}:4318"
      - "${OTELCOL_HEALTH_PORT:-13133}:13133"
    volumes:
      - ./otelcol.config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      phoenix:
        condition: service_started
      hyperdx:
        condition: service_started

volumes:
  phoenix_data:
  hyperdx_db:
  hyperdx_ch_data:
  hyperdx_ch_logs:

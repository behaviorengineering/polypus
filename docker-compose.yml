# Phoenix OTLP (started by process-compose obs namespace via scripts/pc-phoenix.sh).
# Host gateway: make serve (process-compose). Phoenix: make serve with POLYPUS_PHOENIX=1.
services:
  phoenix:
    image: ${PHOENIX_IMAGE:-arizephoenix/phoenix:latest}
    container_name: polypus-phoenix
    restart: "no"
    ports:
      - "${PHOENIX_PORT:-6006}:6006"
      - "${PHOENIX_OTLP_PORT:-4317}:4317"
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix_data:/data

volumes:
  phoenix_data:
